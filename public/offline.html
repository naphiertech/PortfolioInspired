<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode | Naphier Awalie</title>
  <style>
    :root {
      --background: #000000;
      --foreground: #ffffff;
      --accent: #2563eb;
      --border: #222222;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
    }

    .glass-card {
      max-width: 440px;
      width: 100%;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .tag {
      font-family: monospace;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: inline-block;
      border: 1px solid rgba(37, 99, 235, 0.2);
      padding: 4px 8px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      color: #888888;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--foreground);
      color: var(--background);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 24px;
      border: 1px solid var(--foreground);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      background: transparent;
      color: var(--foreground);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #f43f5e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="tag">
      <span class="status-dot"></span>Offline Mode
    </div>
    <h1>CONNECTION LOST</h1>
    <p>
      You are currently disconnected from the internet. Naphier's offline service worker is serving a cached version of this portfolio. Please reconnect to get live updates.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
